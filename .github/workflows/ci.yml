name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Web/ClientApp/package-lock.json
      # The .NET build also writes the API description (wwwroot/openapi/v1.json)
      # that the front end's typed API client is generated from.
      - name: Build
        run: dotnet build Shortlist.slnx -c Release
      - name: Install client packages
        working-directory: src/Web/ClientApp
        run: npm ci
      - name: Generate the typed API client
        working-directory: src/Web/ClientApp
        run: npm run generate-api
      - name: Type check client
        working-directory: src/Web/ClientApp
        run: npm run typecheck
      - name: Lint client
        working-directory: src/Web/ClientApp
        run: npm run lint
      - name: Build client
        working-directory: src/Web/ClientApp
        run: npm run build
      - name: Unit tests
        run: |
          for p in Domain.UnitTests Application.UnitTests; do
            dotnet test tests/$p -c Release --no-build --logger "trx;LogFileName=$p.trx" --results-directory TestResults
          done
      - name: Functional and integration tests
        run: |
          for p in Application.FunctionalTests Infrastructure.IntegrationTests; do
            dotnet test tests/$p -c Release --no-build --logger "trx;LogFileName=$p.trx" --results-directory TestResults
          done
      # Puts the test counts on the check run as a notice, so reviewers (and the review card) can see them.
      - name: Test counts
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          parts = []
          for f in sorted(glob.glob('TestResults/*.trx')):
              c = ET.parse(f).getroot().find('t:ResultSummary/t:Counters', ns).attrib
              parts.append(f"{os.path.basename(f)[:-4]}: {c['passed']}/{c['total']} passed")
          print('::notice title=Test counts::' + ' | '.join(parts or ['no results']))
          PY
